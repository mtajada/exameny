name: Local Supabase integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-stack:
    name: Auth, RLS, Edge and role smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use Deno 2.9.5
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.115.0

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start clean local Supabase
        run: |
          supabase start
          supabase db reset --local
          supabase db lint --local

      - name: Configure ephemeral local-only test environment
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env > /tmp/exameny-supabase.env
          set -a
          source /tmp/exameny-supabase.env
          set +a
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_URL=$API_URL"
            echo "EXAMENY_SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY"
            echo "VITE_AUTH_GOOGLE_ENABLED=false"
            echo "VITE_AUTH_MICROSOFT_ENABLED=false"
            echo "VITE_AUTH_MAGIC_LINK_ENABLED=true"
            echo "VITE_ENABLE_ANALYTICS=false"
          } >> "$GITHUB_ENV"
          umask 077
          {
            echo "EXAMENY_SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY"
            echo "EXAMENY_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SITE_URL=http://127.0.0.1:8080"
            echo "ALLOWED_ORIGINS=http://127.0.0.1:8080,http://localhost:8080"
            echo "APP_ENV=development"
            echo "E2E_FIXTURES_ENABLED=true"
            echo "RATE_LIMIT_ALLOW_IN_MEMORY_FALLBACK=true"
            echo "VITE_AUTH_GOOGLE_ENABLED=false"
            echo "VITE_AUTH_MICROSOFT_ENABLED=false"
            echo "VITE_AUTH_MAGIC_LINK_ENABLED=true"
          } > supabase/.env.ci

      - name: Serve Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          nohup supabase functions serve \
            --env-file supabase/.env.ci \
            > /tmp/exameny-functions.log 2>&1 &
          for attempt in {1..45}; do
            if grep -q "Serving functions" /tmp/exameny-functions.log; then
              exit 0
            fi
            if ! pgrep -f "supabase functions serve" > /dev/null; then
              sed -n '1,200p' /tmp/exameny-functions.log
              exit 1
            fi
            sleep 2
          done
          sed -n '1,200p' /tmp/exameny-functions.log
          exit 1

      - name: Run authenticated role smoke tests
        run: npm run test:e2e

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-stack-playwright-failures
          path: |
            test-results/**/error-context.md
            test-results/**/*.png
            /tmp/exameny-functions.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local services
        if: always()
        run: supabase stop --no-backup
