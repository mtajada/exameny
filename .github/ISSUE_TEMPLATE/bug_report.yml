name: Bug report
description: Report a reproducible problem using synthetic or redacted data.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, personal data, private submissions, or production logs. Report security issues through the private route in SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behaviour and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest sequence that reproduces the issue with synthetic data.
      placeholder: |
        1. Start from...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or full commit SHA
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Affected workflow
      options:
        - Public demo
        - Learner
        - Teacher
        - Academy administrator
        - Platform administrator
        - Self-hosting or maintenance
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, Node/Deno versions, and local or hosted setup. Do not paste env values.
  - type: checkboxes
    id: safety
    attributes:
      label: Data check
      options:
        - label: I removed credentials, personal data, private submissions, and production identifiers.
          required: true
