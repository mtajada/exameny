name: Feature request
description: Propose a focused improvement for learners, educators, or maintainers.
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has this problem, and what can they not do today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the smallest useful result, not a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or example
      description: Use synthetic examples only. Do not paste protected examination material.
  - type: textarea
    id: risks
    attributes:
      label: Privacy, security, licensing, or pedagogy risks
      description: Note any new data, permissions, AI behaviour, or content provenance involved.
  - type: checkboxes
    id: originality
    attributes:
      label: Content check
      options:
        - label: Any example supplied here is original, synthetic, or compatibly licensed with attribution.
          required: true
